<!DOCTYPE html>
<html>
<head>
<title>PDF Merger - Saniya</title>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<style>
body{font-family:Arial;text-align:center;padding:50px;background:#f5f5f5}
.box{background:white;padding:30px;border-radius:15px;box-shadow:0 0 15px #ccc;max-width:500px;margin:auto}
button{padding:12px 20px;background:#ff4081;color:white;border:none;border-radius:8px;cursor:pointer;font-size:16px;margin-top:15px}
input{margin:15px 0}
</style>
</head>
<body>
<div class="box">
<h2>PDF Merger Tool</h2>
<p>select 2 or more PDF files to merge</p>
<input type="file" id="pdfs" multiple accept=".pdf"><br>
<button onclick="mergePDFs()">Merge & Download</button>
<p id="status"></p>
</div>

<script>
async function mergePDFs(){
 const files = document.getElementById('pdfs').files;
 if(files.length < 2){ alert("Kam se kam 2 PDF select karo"); return; }
 document.getElementById('status').innerText = "Merging ho raha hai...";
 const mergedPdf = await PDFLib.PDFDocument.create();
 for(let file of files){
   const bytes = await file.arrayBuffer();
   const pdf = await PDFLib.PDFDocument.load(bytes);
   const copiedPages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
   copiedPages.forEach((page)=> mergedPdf.addPage(page));
 }
 const mergedBytes = await mergedPdf.save();
 const blob = new Blob([mergedBytes], {type: "application/pdf"});
 const link = document.createElement('a');
 link.href = URL.createObjectURL(blob);
 link.download = "merged.pdf";
 link.click();
 document.getElementById('status').innerText = "Ho gaya! Download start ho gaya.";
}
</script>
</body>
</html>
